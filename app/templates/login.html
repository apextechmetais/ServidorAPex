<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Apextech Metais</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/apex-painel.css') }}?v=7">
    <style>
        /* Mesma tela de entrada do painel administrativo */
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
            background:
                radial-gradient(900px 500px at 80% 0, rgba(37, 208, 127, 0.14), transparent 60%),
                linear-gradient(180deg, var(--ap-base), var(--ap-floresta) 60%, var(--ap-base));
        }
        .login-wrapper { width: 100%; max-width: 400px; }
        .login-box {
            background: rgba(5, 19, 12, 0.78); border: 1px solid var(--ap-linha); border-radius: 16px;
            padding: 40px 36px 32px; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9);
        }
        .login-logo { text-align: center; margin-bottom: 18px; }
        .login-logo img { max-width: 180px; filter: brightness(0) invert(1); }
        .login-title { text-align: center; font-size: 1.35rem; font-weight: 700; font-stretch: 112%; color: #fff; }
        .login-sub { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 28px; color: var(--ap-texto-2); font-size: 0.9rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ap-verde); box-shadow: 0 0 0 4px rgba(37, 208, 127, 0.18); }
        .login-box .form-control { padding: 11px 14px; }
        .login-box .input-group .form-control { border-right: 0 !important; border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; }
        .login-box .input-group .btn { border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important; }
        .btn-apex {
            width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--ap-verde); color: var(--ap-base);
            font-family: var(--ap-fonte); font-weight: 700; font-size: 1rem; transition: background-color 0.18s var(--ap-suave), scale 0.12s var(--ap-suave);
        }
        .btn-apex:hover { background: #4BE39A; }
        .btn-apex:active { scale: 0.98; }
        .login-footer { text-align: center; margin-top: 18px; font-size: 0.8rem; color: var(--ap-texto-2); }
    </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-box">

    <div class="login-logo">
      <img src="{{ url_for('static', filename='img/logo-apextech.svg') }}" alt="Apextech Metais">
    </div>

    <div class="login-title">Apextech Metais</div>
    <div class="login-sub">
      <span class="status-dot"></span>
      Financeiro · Notas Fiscais
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} mb-3">
            <i class="fa-solid fa-circle-exclamation me-2"></i>{{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label"><i class="fa-solid fa-user me-1"></i>Usuário</label>
        <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" autofocus required autocomplete="username">
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="fa-solid fa-lock me-1"></i>Senha</label>
        <div class="input-group">
          <input type="password" name="password" id="inputSenhaLogin" class="form-control border-end-0" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary border-start-0 bg-transparent text-light" id="btnToggleSenha" title="Mostrar/Ocultar Senha">
            <i class="fa-solid fa-eye" id="iconeOlho"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-apex">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
      </button>
    </form>

  </div>
  <div class="login-footer">
    Apextech Metais &mdash; Acesso restrito
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const btnToggle = document.getElementById("btnToggleSenha");
    const inputSenha = document.getElementById("inputSenhaLogin");
    const iconeOlho = document.getElementById("iconeOlho");

    if (btnToggle && inputSenha && iconeOlho) {
      btnToggle.addEventListener("click", function() {
        if (inputSenha.type === "password") {
          inputSenha.type = "text";
          iconeOlho.className = "fa-solid fa-eye-slash text-success";
        } else {
          inputSenha.type = "password";
          iconeOlho.className = "fa-solid fa-eye";
        }
      });
    }
  });
</script>
</body>
</html>
